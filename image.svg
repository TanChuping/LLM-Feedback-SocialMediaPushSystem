    <line x1="-18" y1="-2" x2="18" y2="-2" stroke="#999" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-18" y1="6" x2="8" y2="6" stroke="#999" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-18" y1="13" x2="14" y2="13" stroke="#999" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 8: Snapchat -->
  <g class="s8" opacity="0">
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#FFFC00" stroke="#4E342E" stroke-width="3"/>
    <path d="M0,-11 C-13,-11 -16,0 -16,5 L-21,5 L-16,8 C-18,13 -11,16 0,16 C11,16 18,13 16,8 L21,5 L16,5 C16,0 13,-11 0,-11 Z" fill="#fff" stroke="#333" stroke-width="2"/>
  </g>

  <!-- 9: 爱心 -->
