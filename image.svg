    <circle cx="0" cy="0" r="25" fill="#1877F2" stroke="#4E342E" stroke-width="3"/>
    <path d="M0,13 C-18,-3 -18,-13 -8,-13 C-3,-13 0,-8 0,-8 C0,-8 3,-13 8,-13 C18,-13 18,-3 0,13 Z" fill="#fff"/>
  </g>

