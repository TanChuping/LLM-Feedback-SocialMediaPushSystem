    <path d="M-10,-10 L10,10 M10,-10 L-10,10" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 5: TikTok -->
  <g class="s5" opacity="0">
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#010101" stroke="#4E342E" stroke-width="3"/>
    <path d="M3,-14 L3,8 C3,16 -11,18 -11,10 C-11,3 3,3 3,8" fill="none" stroke="#25F4EE" stroke-width="4" stroke-linecap="round"/>
    <path d="M5,-14 C10,-11 16,-8 19,-14" fill="none" stroke="#FE2C55" stroke-width="4" stroke-linecap="round"/>
  </g>

