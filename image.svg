    <line x1="-8" y1="28" x2="-18" y2="-20" stroke="#4E342E" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="8" y1="28" x2="18" y2="-20" stroke="#4E342E" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M-105,-15 C-125,-15 -135,-55 -105,-70 C-100,-105 -55,-115 -25,-100
             C-5,-125 45,-125 65,-100 C95,-115 135,-85 125,-60 C145,-35 115,-15 95,-15 Z"
          fill="#FFD54F" stroke="#4E342E" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-105" rx="45" ry="25" fill="#FFCA28" stroke="#4E342E" stroke-width="5"/>
    <ellipse cx="-50" cy="-75" rx="25" ry="18" fill="#FFD54F" stroke="#4E342E" stroke-width="4"/>
    <ellipse cx="55" cy="-78" rx="28" ry="18" fill="#FFD54F" stroke="#4E342E" stroke-width="4"/>
    <path d="M-80,-25 C-60,-45 -30,-50 -10,-35" fill="none" stroke="#FFECB3" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <path d="M15,-65 C35,-75 65,-70 75,-50" fill="none" stroke="#FFECB3" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <path d="M-55,-70 C-35,-85 5,-85 25,-70" fill="none" stroke="#FFF176" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- 碎片 -->
  <ellipse class="d1" cx="0" cy="0" rx="12" ry="9" fill="#E65100" stroke="#4E342E" stroke-width="4" transform="translate(105,175)"/>
  <ellipse class="d2" cx="0" cy="0" rx="10" ry="13" fill="#FF8F00" stroke="#4E342E" stroke-width="4" transform="translate(395,170)"/>
  <circle class="d3" cx="0" cy="0" r="8" fill="#D84315" stroke="#4E342E" stroke-width="3" transform="translate(120,115)"/>
  <circle class="d4" cx="0" cy="0" r="6" fill="#FF6F00" stroke="#4E342E" stroke-width="3" transform="translate(380,108)"/>
  <circle cx="100" cy="90" r="5" fill="#EF6C00" stroke="#4E342E" stroke-width="2.5" opacity="0.7"/>
  <circle cx="400" cy="80" r="4" fill="#F57C00" stroke="#4E342E" stroke-width="2.5" opacity="0.7"/>

  <!-- 1: YouTube -->
  <g class="s1" opacity="0">
    <rect x="-30" y="-22" width="60" height="44" rx="10" fill="#FF0000" stroke="#4E342E" stroke-width="3"/>
    <polygon points="-8,-11 14,0 -8,11" fill="#fff"/>
  </g>

  <!-- 2: Facebook -->
  <g class="s2" opacity="0">
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#1877F2" stroke="#4E342E" stroke-width="3"/>
    <text x="0" y="11" font-family="Arial,sans-serif" font-weight="bold" font-size="36" fill="#fff" text-anchor="middle">f</text>
  </g>

  <!-- 3: Instagram -->
  <g class="s3" opacity="0">
    <rect x="-26" y="-26" width="52" height="52" rx="15" fill="#E4405F" stroke="#4E342E" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#fff" stroke-width="3.5"/>
    <circle cx="14" cy="-14" r="3.5" fill="#fff"/>
  </g>

