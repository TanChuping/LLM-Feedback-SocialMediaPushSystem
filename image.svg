<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -30 660 760" width="660" height="760">
  <defs>
    <style>
      @keyframes tremor {
        0%   { transform: translate(250px,145px) rotate(0deg); }
        10%  { transform: translate(252px,144px) rotate(0.8deg); }
        20%  { transform: translate(248px,146px) rotate(-0.6deg); }
        30%  { transform: translate(251px,143px) rotate(0.4deg); }
        40%  { transform: translate(249px,147px) rotate(-0.9deg); }
        50%  { transform: translate(253px,145px) rotate(0.7deg); }
        60%  { transform: translate(247px,144px) rotate(-0.5deg); }
        70%  { transform: translate(250px,147px) rotate(0.3deg); }
        80%  { transform: translate(252px,143px) rotate(-0.8deg); }
        90%  { transform: translate(248px,146px) rotate(0.6deg); }
        100% { transform: translate(250px,145px) rotate(0deg); }
      }
      .cloud-group { animation: tremor 0.3s infinite ease-in-out; }

      @keyframes eyeShake {
        0%, 100% { transform: translate(0,0); }
        25% { transform: translate(-2px,1px); }
        50% { transform: translate(1px,-1px); }
        75% { transform: translate(-1px,-1px); }
      }
      .eyes { animation: eyeShake 0.2s infinite; }

      @keyframes suck1 {
        0%   { transform: translate(30px,560px) scale(1.4) rotate(-15deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(200deg); opacity:0; }
      }
      @keyframes suck2 {
        0%   { transform: translate(470px,550px) scale(1.5) rotate(20deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(-180deg); opacity:0; }
      }
      @keyframes suck3 {
        0%   { transform: translate(120px,590px) scale(1.3) rotate(10deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(150deg); opacity:0; }
      }
      @keyframes suck4 {
        0%   { transform: translate(380px,600px) scale(1.6) rotate(-25deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(-220deg); opacity:0; }
      }
      @keyframes suck5 {
        0%   { transform: translate(250px,610px) scale(1.3) rotate(5deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(300deg); opacity:0; }
      }
      @keyframes suck6 {
        0%   { transform: translate(10px,530px) scale(1.2) rotate(30deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(-160deg); opacity:0; }
      }
      @keyframes suck7 {
        0%   { transform: translate(490px,590px) scale(1.4) rotate(-40deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(250deg); opacity:0; }
      }
      @keyframes suck8 {
        0%   { transform: translate(80px,620px) scale(1.5) rotate(15deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(-300deg); opacity:0; }
      }
      @keyframes suck9 {
        0%   { transform: translate(420px,540px) scale(1.3) rotate(-10deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(180deg); opacity:0; }
      }
      @keyframes suck10 {
        0%   { transform: translate(180px,580px) scale(1.45) rotate(35deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(-250deg); opacity:0; }
      }
      @keyframes suck11 {
        0%   { transform: translate(320px,570px) scale(1.35) rotate(-50deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(270deg); opacity:0; }
      }
      @keyframes suck12 {
        0%   { transform: translate(60px,600px) scale(1.55) rotate(45deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(-190deg); opacity:0; }
      }
      @keyframes suck13 {
        0%   { transform: translate(440px,620px) scale(1.25) rotate(-35deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(210deg); opacity:0; }
      }
      @keyframes suck14 {
        0%   { transform: translate(150px,545px) scale(1.4) rotate(55deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(-280deg); opacity:0; }
      }
      @keyframes suck15 {
        0%   { transform: translate(350px,560px) scale(1.6) rotate(-5deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(160deg); opacity:0; }
      }
      @keyframes suck16 {
        0%   { transform: translate(250px,630px) scale(1.3) rotate(25deg); opacity:0; }
        8%   { opacity:1; } 75% { opacity:1; }
        100% { transform: translate(250px,390px) scale(0.05) rotate(-340deg); opacity:0; }
      }

      .s1  { animation: suck1  1.8s infinite ease-in; animation-delay:0s; }
      .s2  { animation: suck2  2.0s infinite ease-in; animation-delay:0.3s; }
      .s3  { animation: suck3  2.2s infinite ease-in; animation-delay:0.6s; }
      .s4  { animation: suck4  1.9s infinite ease-in; animation-delay:0.15s; }
      .s5  { animation: suck5  2.1s infinite ease-in; animation-delay:0.45s; }
      .s6  { animation: suck6  1.7s infinite ease-in; animation-delay:0.75s; }
      .s7  { animation: suck7  2.3s infinite ease-in; animation-delay:0.9s; }
      .s8  { animation: suck8  1.85s infinite ease-in; animation-delay:1.1s; }
      .s9  { animation: suck9  2.0s infinite ease-in; animation-delay:0.5s; }
      .s10 { animation: suck10 2.15s infinite ease-in; animation-delay:1.3s; }
      .s11 { animation: suck11 1.95s infinite ease-in; animation-delay:0.2s; }
      .s12 { animation: suck12 2.25s infinite ease-in; animation-delay:0.65s; }
      .s13 { animation: suck13 1.75s infinite ease-in; animation-delay:1.0s; }
      .s14 { animation: suck14 2.05s infinite ease-in; animation-delay:0.35s; }
      .s15 { animation: suck15 1.9s infinite ease-in; animation-delay:0.85s; }
      .s16 { animation: suck16 2.3s infinite ease-in; animation-delay:1.15s; }

      @keyframes debris1 {
        0%, 100% { transform: translate(105px,175px) scale(1); opacity:0.9; }
        50% { transform: translate(92px,162px) scale(1.2); opacity:1; }
      }
      @keyframes debris2 {
        0%, 100% { transform: translate(395px,170px) scale(1); opacity:0.9; }
        50% { transform: translate(408px,157px) scale(1.25); opacity:1; }
      }
      @keyframes debris3 {
        0%, 100% { transform: translate(120px,115px) scale(1); opacity:0.8; }
        50% { transform: translate(108px,103px) scale(1.15); opacity:1; }
      }
      @keyframes debris4 {
        0%, 100% { transform: translate(380px,108px) scale(1); opacity:0.85; }
        50% { transform: translate(392px,96px) scale(1.18); opacity:1; }
      }
      .d1 { animation: debris1 0.6s infinite ease-in-out; }
      .d2 { animation: debris2 0.5s infinite ease-in-out; }
      .d3 { animation: debris3 0.7s infinite ease-in-out; }
      .d4 { animation: debris4 0.55s infinite ease-in-out; }
    </style>
  </defs>

  <!-- 脑壳 -->
  <path d="M105,280 C105,440 160,510 250,510 C340,510 395,440 395,280
           L375,200 L345,220 L310,185 L270,215 L230,185 L195,220 L165,195 L135,215 Z"
        fill="#FFD54F" stroke="#4E342E" stroke-width="7" stroke-linejoin="round"/>

  <!-- 裂纹 -->
  <line x1="165" y1="195" x2="175" y2="245" stroke="#4E342E" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="220" x2="188" y2="260" stroke="#4E342E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="310" y1="185" x2="320" y2="235" stroke="#4E342E" stroke-width="3" stroke-linecap="round"/>
  <line x1="345" y1="220" x2="335" y2="255" stroke="#4E342E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="230" y1="185" x2="225" y2="230" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>
  <line x1="270" y1="215" x2="278" y2="248" stroke="#4E342E" stroke-width="2" stroke-linecap="round"/>

  <!-- 眼睛 -->
  <g class="eyes">
    <ellipse cx="200" cy="295" rx="22" ry="28" fill="#3E2723"/>
    <ellipse cx="205" cy="287" rx="6" ry="8" fill="#fff" opacity="0.35"/>
    <ellipse cx="300" cy="295" rx="22" ry="28" fill="#3E2723"/>
    <ellipse cx="305" cy="287" rx="6" ry="8" fill="#fff" opacity="0.35"/>
  </g>

  <!-- 嘴巴 -->
  <ellipse cx="250" cy="405" rx="95" ry="72" fill="#2D1B11" stroke="#4E342E" stroke-width="6"/>
  <ellipse cx="250" cy="385" rx="40" ry="25" fill="#1A0E08"/>
  <path d="M180,435 C200,462 300,462 320,435 C310,452 190,452 180,435 Z" fill="#E64A19" stroke="#4E342E" stroke-width="3"/>

